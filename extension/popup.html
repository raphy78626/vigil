<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 360px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e4e4ef;
    padding: 16px;
  }
  h1 { font-size: 18px; color: #818cf8; margin-bottom: 2px; }
  .subtitle { font-size: 11px; color: #6b7280; margin-bottom: 14px; }
  .version { font-size: 10px; color: #4b5563; margin-left: 6px; }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #12121a; border: 1px solid #2a2a3a; border-radius: 10px;
    padding: 12px; margin-bottom: 14px;
  }
  .status-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .dot.off { background: #ef4444; }
  .status-text { font-size: 13px; font-weight: 600; }

  .btn {
    border: none; border-radius: 7px; padding: 7px 16px;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-primary { background: #6366f1; color: white; }
  .btn-green { background: #22c55e; color: white; }
  .btn-red { background: #ef4444; color: white; }
  .btn-blue { background: #3b82f6; color: white; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px;
  }
  .stat-card {
    background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px;
    padding: 10px; text-align: center;
  }
  .stat-value { font-size: 20px; font-weight: 700; color: #818cf8; }
  .stat-label { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }

  .section-label { font-size: 11px; color: #6b7280; margin-bottom: 5px; display: block; }
  .input-row {
    width: 100%; background: #12121a; border: 1px solid #2a2a3a;
    border-radius: 7px; padding: 9px; color: #e4e4ef; font-size: 12px;
    margin-bottom: 10px; outline: none;
  }
  .input-row:focus { border-color: #6366f1; }

  .actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .actions .btn { flex: 1; padding: 10px; font-size: 12px; }

  .demo-hint {
    margin-top: 8px; padding: 10px; background: #1a1a2e;
    border: 1px solid #2a2a3a; border-radius: 8px; font-size: 11px; color: #8888a0;
  }
  .demo-hint a { color: #818cf8; text-decoration: none; }
  .demo-hint a:hover { text-decoration: underline; }

  .flush-msg {
    font-size: 11px; margin-top: 6px; text-align: center;
    min-height: 16px; transition: color .3s;
  }
  .flush-msg.ok { color: #22c55e; }
  .flush-msg.err { color: #ef4444; }
</style>
</head>
<body>
  <h1>Vigil <span class="version">v1.0</span></h1>
  <div class="subtitle">Production-grade QA Observability</div>

  <div class="status-bar">
    <div class="status-left">
      <div class="dot" id="dot"></div>
      <span class="status-text" id="status-text">Loading...</span>
    </div>
    <button class="btn btn-primary" id="toggle-btn">Toggle</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="event-count">0</div>
      <div class="stat-label">Events</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="session-id">—</div>
      <div class="stat-label">Session</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="uptime">0m</div>
      <div class="stat-label">Uptime</div>
    </div>
  </div>

  <label class="section-label">Capture domains (empty = all sites)</label>
  <input type="text" class="input-row" id="domain-input"
         placeholder="e.g. saucedemo.com, myapp.io">

  <label class="section-label">Backend URL (for auto-flush)</label>
  <input type="text" class="input-row" id="backend-input"
         placeholder="e.g. http://localhost:8000">

  <div class="actions">
    <button class="btn btn-blue" id="flush-btn">Flush to Backend</button>
    <button class="btn btn-green" id="export-btn">Export JSON</button>
    <button class="btn btn-red" id="clear-btn">Clear</button>
  </div>
  <div class="flush-msg" id="flush-msg"></div>

  <div class="demo-hint">
    <strong>Captures:</strong> test-id, aria-label, role, label, placeholder, name, title, href, stable CSS<br>
    <a href="https://www.saucedemo.com" target="_blank">saucedemo.com</a> &middot;
    <a href="https://the-internet.herokuapp.com" target="_blank">herokuapp.com</a> &middot;
    <a href="https://todomvc.com/examples/react/dist/" target="_blank">todomvc.com</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
